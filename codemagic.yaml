# Codemagic 云构建 · 仅出"未签名 IPA"，不碰任何苹果签名
# 配合 Windows 端 Sideloadly + 免费 Apple ID 侧载进自己的 iPhone
# 全程无需 $99 付费账号、无需证书/描述文件、无需任何 Apple Secret
#
# 仓库结构：project.yml / codemagic.yaml / Info.plist 在根目录，
# Swift 源码在 ArchiveIOS/ 子目录（由 project.yml 的 sources: path: ArchiveIOS 引用）。
# xcodegen 从根目录生成 .xcodeproj，后续归档/打包均在根目录执行。
workflows:
  ios-ipa-free:
    name: Build unsigned IPA (Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: ArchiveIOS.xcodeproj
        XCODE_SCHEME: ArchiveIOS
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Archive (unsigned, no paid cert)
        script: |
          set -e
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/ArchiveIOS.xcarchive \
            -destination 'generic/platform=iOS' \
            clean archive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=""
      - name: Package IPA (Payload)
        script: |
          set -e
          APP=$(find build/ArchiveIOS.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -1)
          echo "App path: $APP"
          if [ -z "$APP" ]; then echo "ERROR: .app not found"; exit 1; fi
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -r ArchiveIOS.ipa Payload
          ls -la ArchiveIOS.ipa
    artifacts:
      - build/ipa/ArchiveIOS.ipa
    publishing:
      email:
        recipients:
          - user@example.com
